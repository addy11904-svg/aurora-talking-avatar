<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Talking Avatar</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    img {
      width: 300px;
      position: absolute;
      transition: opacity 0.15s ease;
    }
  </style>
</head>
<body>
  <!-- Two images stacked on top of each other -->
  <img id="closed" src="aurora.mouthclose.png" alt="Aurora closed mouth" />
  <img id="open" src="aurora.mouthopen.png" alt="Aurora open mouth" style="opacity: 0" />

  <script>
    const openImg = document.getElementById("open");
    const closedImg = document.getElementById("closed");
    let lastState = "close";

    function updateMouth(volume) {
      if (volume > 0.1 && lastState !== "open") {
        openImg.style.opacity = 1;
        closedImg.style.opacity = 0;
        lastState = "open";
      } else if (volume <= 0.1 && lastState !== "close") {
        openImg.style.opacity = 0;
        closedImg.style.opacity = 1;
        lastState = "close";
      }
    }

    // Simulated talking (random volume)
    setInterval(() => {
      const volume = Math.random();
      updateMouth(volume);
    }, 150); // adjust this speed if needed
  </script>
</body>
</html>
