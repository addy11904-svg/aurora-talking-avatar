
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Talking Avatar</title>
<style>
  body {
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  img {
    width: 300px;
    position: absolute;
    transition: opacity 0.05s linear;
  }

  #open { z-index: 1; opacity: 1; }
  #closed { z-index: 2; opacity: 0; }
  #blink { z-index: 3; opacity: 0; }
</style>
</head>
<body>

  <img id="open" src="aurora-open.png">
  <img id="closed" src="aurora-closed.png">
  <img id="blink" src="aurora-blink.png">

<script>
const openImg = document.getElementById("open");
const closedImg = document.getElementById("closed");
const blinkImg = document.getElementById("blink");

navigator.mediaDevices.getUserMedia({ audio: true })
  .then(stream => {
    const audioCtx = new AudioContext();
    const analyser = audioCtx.createAnalyser();
    const mic = audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);

    function detectVolume() {
      analyser.getByteFrequencyData(data);
      const volume = data.reduce((a, b) => a + b, 0) / data.length;

      if (volume > 30 && blinkImg.style.opacity === "0") {
        openImg.style.opacity = 0;
        closedImg.style.opacity = 1;
      } else if (volume <= 30 && blinkImg.style.opacity === "0") {
        openImg.style.opacity = 1;
        closedImg.style.opacity = 0;
      }
      requestAnimationFrame(detectVolume);
    }
    detectVolume();
  })
  .catch(err => console.error("Mic error:", err));

// Prevent overlap flicker by hiding both under blink
function blink() {
  openImg.style.opacity = 0;
  closedImg.style.opacity = 0;
  blinkImg.style.opacity = 1;
  setTimeout(() => {
    blinkImg.style.opacity = 0;
  }, 100); // 100ms blink
}

setInterval(() => {
  blink();
}, 4000 + Math.random() * 2000);
</script>

</body>
</html>
