<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Talking Avatar</title>
  <style>
    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #avatar-container {
      position: relative;
      width: 400px;
      height: auto;
    }

    img {
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 0.25s ease-in-out;
    }

    #open {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="avatar-container">
    <img id="closed" src="aurora.mouthclose.png" alt="Aurora closed mouth" />
    <img id="open" src="aurora.mouthopen.png" alt="Aurora open mouth" />
  </div>

  <script>
    const openMouth = document.getElementById("open");
    const closedMouth = document.getElementById("closed");

    let lastChange = 0;
    let smoothVolume = 0;
    const threshold = 0.1; // Adjust if needed (0.05–0.2 range)
    const debounceTime = 150; // milliseconds between mouth toggles

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);

        function detectVolume() {
          analyser.getByteFrequencyData(dataArray);
          const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length / 255;

          // Smooth the volume readings
          smoothVolume = 0.8 * smoothVolume + 0.2 * avg;

          const now = Date.now();
          if (now - lastChange > debounceTime) {
            if (smoothVolume > threshold) {
              openMouth.style.opacity = 1;
              closedMouth.style.opacity = 0;
            } else {
              openMouth.style.opacity = 0;
              closedMouth.style.opacity = 1;
            }
            lastChange = now;
          }

          requestAnimationFrame(detectVolume);
        }

        detectVolume();
      })
      .catch(err => alert("Microphone access denied or unavailable: " + err));
  </script>
</body>
</html>
