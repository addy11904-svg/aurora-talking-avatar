<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Talking Avatar</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    img {
      width: auto;
      height: 90vh;
      position: absolute;
      transition: opacity 0.1s ease-in-out;
    }
  </style>
</head>
<body>
  <img id="base" src="aurora.mouthclose.png" alt="Aurora" />
  <img id="mouth" src="aurora.mouthopen.png" alt="Aurora mouth open" style="opacity: 0;" />
  <img id="blink" src="aurora.blink.png" alt="Aurora blink" style="opacity: 0;" />

  <script>
    // Blinking
    function blink() {
      const blinkImg = document.getElementById('blink');
      blinkImg.style.opacity = 1;
      setTimeout(() => (blinkImg.style.opacity = 0), 150);
      setTimeout(blink, 4000 + Math.random() * 4000);
    }
    setTimeout(blink, 2000);

    // Talking (simulate speech loop)
    let talking = true;
    function talk() {
      const mouth = document.getElementById('mouth');
      if (talking) {
        mouth.style.opacity = mouth.style.opacity == 1 ? 0 : 1;
      } else {
        mouth.style.opacity = 0;
      }
      setTimeout(talk, 200);
    }
    talk();
  </script>
</body>
</html>
