<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Animation</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    img {
      width: 450px;
      image-rendering: auto;
      transition: opacity 0.08s ease-in-out;
    }

    .hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <img id="aurora" src="aurora.mouthclose.png" alt="Aurora" />

  <script>
    const aurora = document.getElementById("aurora");

    // Preload images
    const frames = [
      "aurora.mouthclose.png",
      "aurora.mouthopen.png",
      "aurora.blink.png"
    ];
    const cache = {};
    frames.forEach(src => {
      const img = new Image();
      img.src = src;
      cache[src] = img;
    });

    // Animation loop
    let current = "mouthclose";
    function animateAurora() {
      // Faster blink (every 1.5–3 seconds)
      const blinkTime = Math.random() * 1500 + 1500;
      setTimeout(() => {
        aurora.src = "aurora.blink.png";
        setTimeout(() => aurora.src = cache[`aurora.${current}.png`].src, 120);
        animateAurora();
      }, blinkTime);
    }

    // Mouth animation (every 1 second)
    setInterval(() => {
      current = current === "mouthclose" ? "mouthopen" : "mouthclose";
      aurora.classList.add("hidden");
      setTimeout(() => {
        aurora.src = cache[`aurora.${current}.png`].src;
        aurora.classList.remove("hidden");
      }, 80);
    }, 1000);

    // Start blinking animation
    animateAurora();
  </script>
</body>
</html>
