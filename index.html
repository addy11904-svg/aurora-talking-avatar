<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Talking Avatar</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .avatar {
    position: relative;
    width: 400px;
    height: auto;
  }

  .avatar img {
    position: absolute;
    width: 100%;
    transition: opacity 0.12s ease-in-out;
  }
</style>
</head>
<body>
  <div class="avatar">
    <!-- 👇 Use your PNGs here -->
    <img id="open" src="aurora_open.png" style="opacity: 1;" />
    <img id="closed" src="aurora_closed.png" style="opacity: 0;" />
    <img id="blink" src="aurora_blink.png" style="opacity: 0;" />
  </div>

<script>
const openImg = document.getElementById("open");
const closedImg = document.getElementById("closed");
const blinkImg = document.getElementById("blink");

let isBlinking = false;

// 🎤 Mouth movement logic
navigator.mediaDevices.getUserMedia({ audio: true })
  .then(stream => {
    const audioCtx = new AudioContext();
    const analyser = audioCtx.createAnalyser();
    const mic = audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);

    function detectVolume() {
      analyser.getByteFrequencyData(data);
      const volume = data.reduce((a, b) => a + b, 0) / data.length;

      if (!isBlinking) {
        if (volume > 30) {
          openImg.style.opacity = 0;
          closedImg.style.opacity = 1;
        } else {
          openImg.style.opacity = 1;
          closedImg.style.opacity = 0;
        }
      }

      requestAnimationFrame(detectVolume);
    }
    detectVolume();
  })
  .catch(err => console.error("Mic error:", err));

// 👁️ Blink logic
function blink() {
  isBlinking = true;
  openImg.style.opacity = 0;
  closedImg.style.opacity = 0;
  blinkImg.style.opacity = 1;

  // eyes closed duration
  setTimeout(() => {
    blinkImg.style.opacity = 0;
    openImg.style.transition = "opacity 0.25s ease-out"; // smooth reopen
    openImg.style.opacity = 1;
    isBlinking = false;

    // random next blink (4–7 seconds)
    const nextBlink = 4000 + Math.random() * 3000;
    setTimeout(blink, nextBlink);
  }, 120);
}

// start after a moment
setTimeout(blink, 3000);
</script>
</body>
</html>
