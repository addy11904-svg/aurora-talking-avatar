<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Talking Avatar</title>
  <style>
    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    img {
      width: 300px;
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body>
  <img id="avatar" src="aurora.png" alt="Aurora Talking Avatar" />

  <script>
    const avatar = document.getElementById("avatar");

    // Ask for microphone access
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);

        function animateMouth() {
          analyser.getByteFrequencyData(dataArray);
          let volume = dataArray.reduce((a, b) => a + b) / dataArray.length;

          // Map volume to scale (more sound = bigger)
          let scale = 1 + (volume / 300);
          avatar.style.transform = `scaleY(${scale})`;

          requestAnimationFrame(animateMouth);
        }

        animateMouth();
      })
      .catch(err => alert('Microphone access denied or unavailable: ' + err));
  </script>
</body>
</html>
