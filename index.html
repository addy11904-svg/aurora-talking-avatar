<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Talking Avatar</title>
  <style>
    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    img {
      width: 300px;
      transition: opacity 0.1s ease;
      position: absolute;
    }
  </style>
</head>
<body>
  <!-- Two images stacked on top of each other -->
  <img id="closed" src="aurora.png" alt="Aurora closed mouth">
  <img id="open" src="aurora_talk.png" alt="Aurora open mouth" style="opacity: 0">

  <script>
    async function startTalking() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);

        const openImg = document.getElementById("open");
        const closedImg = document.getElementById("closed");

        function detectVolume() {
          analyser.getByteFrequencyData(dataArray);
          let volume = dataArray.reduce((a, b) => a + b) / dataArray.length;

          if (volume > 20) { // Talking threshold
            openImg.style.opacity = 1;
            closedImg.style.opacity = 0;
          } else {
            openImg.style.opacity = 0;
            closedImg.style.opacity = 1;
          }

          requestAnimationFrame(detectVolume);
        }

        detectVolume();
      } catch (err) {
        alert('Microphone access denied or unavailable: ' + err);
      }
    }

    startTalking();
  </script>
</body>
</html>
