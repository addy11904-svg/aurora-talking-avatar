<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Talking Avatar</title>
<style>
  body {
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  img {
    width: 300px;
    position: absolute;
    transition: opacity 0.1s ease;
  }

  /* Layer order — blink always on top */
  #open { z-index: 1; }
  #closed { z-index: 2; }
  #blink { z-index: 3; }
</style>
</head>
<body>

  <!-- Aurora image layers -->
  <img id="open" src="aurora-open.png" style="opacity:1">
  <img id="closed" src="aurora-closed.png" style="opacity:0">
  <img id="blink" src="aurora-blink.png" style="opacity:0">

<script>
  const openImg = document.getElementById("open");
  const closedImg = document.getElementById("closed");
  const blinkImg = document.getElementById("blink");

  // 🎙️ Microphone setup
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      const audioCtx = new AudioContext();
      const analyser = audioCtx.createAnalyser();
      const mic = audioCtx.createMediaStreamSource(stream);
      mic.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);

      function detectVolume() {
        analyser.getByteFrequencyData(data);
        const volume = data.reduce((a, b) => a + b, 0) / data.length;

        // Toggle mouth based on volume
        if (volume > 30) {  // talking
          openImg.style.opacity = 0;
          closedImg.style.opacity = 1;
        } else {             // silent
          openImg.style.opacity = 1;
          closedImg.style.opacity = 0;
        }
        requestAnimationFrame(detectVolume);
      }
      detectVolume();
    })
    .catch(err => console.error("Mic error:", err));

  // 👁️ Blinking (random natural blink)
  setInterval(() => {
    blinkImg.style.opacity = 1;
    setTimeout(() => {
      blinkImg.style.opacity = 0;
    }, 120); // blink speed (shorter = faster)
  }, 4000 + Math.random() * 3000); // every 4–7 seconds
</script>

</body>
</html>
